# equivalente ao Vagrantfile, define os containers e suas configurações
services:
  web:
    build: .
    container_name: arandu
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
      - "8001:8001"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./web-folder:/app/web-folder
    stdin_open: true
    tty: true

